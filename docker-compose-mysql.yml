services:
  mysql:
    image: mysql:9.5.0
    ports:
      - "3301:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=meal_booking
      - MYSQL_USER=mealuser
      - MYSQL_PASSWORD=mealuser
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    container_name: meal-booking-mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
